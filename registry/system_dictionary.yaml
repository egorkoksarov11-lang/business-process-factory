schema_version: "1.0"
systems:
  - system_id: SYS-1C-HR-001
    canonical_name: "1С: Зарплата и управление персоналом"
    aliases:
      - "1С"
      - "1С зарплата и управление персоналом"
      - "программа 1С"
    category: "HRIS / payroll"
    source_refs: [SRC-HR-KDP-001]
    notes: "Источник явно использует 1С для кадровых данных, отчетности и документов воинского учета. В транскрипте присутствует противоречивый фрагмент 'зарплата и управления производством' рядом с формулировкой 'зарплата и управление персоналом'; точная конфигурация и версия остаются UNKNOWN. Telegram, электронная почта, корпоративный мессенджер, личное общение и почтовое отправление не внесены в systems, так как выступают каналами коммуникации/доставки. СФР и военный комиссариат являются внешними органами, а не системами."

  - system_id: SYS-HH-001
    canonical_name: "HeadHunter"
    aliases:
      - "HH"
      - "поисковая площадка HeadHunter"
    category: "Recruitment platform"
    source_refs: [SRC-HR-DIR-001]
    notes: "Используется директором по персоналу как площадка размещения вакансий и получения откликов. Это информационная/поисковая платформа, а не коммуникационный канал и не роль."
