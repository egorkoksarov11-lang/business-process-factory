schema_version: "1.0"
roles:
  - role_id: ROLE-HR-KDP-001
    canonical_name: "Ведущий специалист по кадровому делопроизводству"
    department: "Администрация"
    aliases:
      - "кадровик"
      - "кадровый сотрудник"
      - "сотрудник кадровой службы"
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001, SRC-HR-MODEL-001]
    notes: "SRC-HR-MODEL-001 явно содержит lane 'Кадровик' для оформления приема, воинского учета и элемента 'контроль выхода и начало адаптации'. Последний конфликтует/неоднозначен относительно SRC-HR-DIR-001, где полноценный контроль адаптации описан Директором по персоналу."

  - role_id: ROLE-HR-DIRECTOR-001
    canonical_name: "Директор по персоналу"
    department: UNKNOWN
    aliases: []
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    notes: "Интервьюируемая роль SRC-HR-DIR-001. Lane 'HR' в SRC-HR-MODEL-001 не приписывается этой роли автоматически; соответствие считается cross-source inference и требует проверки Agent 02."

  - role_id: ROLE-HIRING-MANAGER-001
    canonical_name: "Непосредственный руководитель / руководитель подразделения"
    department: UNKNOWN
    aliases:
      - "непосредственный руководитель вакансии"
      - "руководитель подразделения"
      - "инициатор"
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001, SRC-HR-MODEL-002]
    notes: "Инициирует потребность/заявку, определяет функции, взаимодействует с Генеральным директором по заявке; в интервью участвует также во втором этапе собеседования. Конкретная должность зависит от вакансии."

  - role_id: ROLE-CANDIDATE-001
    canonical_name: "Соискатель"
    department: UNKNOWN
    aliases:
      - "кандидат"
      - "выбранный соискатель"
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    notes: "Участник подбора до оформления/выхода. SRC-HR-MODEL-001 явно показывает решение кандидата по офферу."

  - role_id: ROLE-SECURITY-001
    canonical_name: "Служба безопасности"
    department: UNKNOWN
    aliases: []
    source_refs: [SRC-HR-MODEL-001]
    notes: "Подтверждена только существующей reference-моделью как исполнитель проверки кандидата. Lifecycle/approval status модели UNKNOWN; фактическую роль в AS-IS необходимо подтвердить."

  - role_id: ROLE-FIN-CHIEF-ACCOUNTANT-001
    canonical_name: "Главный бухгалтер"
    department: UNKNOWN
    aliases:
      - "бухгалтер, главный бухгалтер"
    source_refs: [SRC-HR-KDP-001, SRC-HR-MODEL-001]
    notes: "SRC-HR-KDP-001: получает от кадровика уведомление о сформированной отчетности и отправляет/подтверждает сдачу. SRC-HR-MODEL-001 размещает 'подготовку и отправку отчета в СФР' целиком в lane Главного бухгалтера; это source conflict по границе ответственности."

  - role_id: ROLE-CEO-001
    canonical_name: "Генеральный директор"
    department: UNKNOWN
    aliases:
      - "генеральный директор"
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001, SRC-HR-MODEL-001, SRC-HR-MODEL-002]
    notes: "Подписывает/согласует разные кадровые объекты по источникам. SRC-HR-MODEL-002 показывает рассмотрение заявки на подбор; SRC-HR-MODEL-001 — условное согласование оффера при негативной информации. Не считать эти reference-модели подтвержденным AS-IS до Agent 02."

  - role_id: ROLE-EMPLOYEE-001
    canonical_name: "Сотрудник"
    department: UNKNOWN
    aliases:
      - "работник"
      - "военнообязанный"
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001, SRC-HR-MODEL-001]
    notes: "Роль возникает после перехода от кандидата к оформленному/вышедшему сотруднику."

  - role_id: ROLE-MIL-RESP-001
    canonical_name: "Ответственный за воинский учет"
    department: UNKNOWN
    aliases:
      - "ответственный за воинский учёт"
    source_refs: [SRC-HR-KDP-001]
    notes: "AMBIGUITY: источник подтверждает функцию/роль и подпись ответственного, но не устанавливает, является ли это отдельным сотрудником или функцией ROLE-HR-KDP-001."
