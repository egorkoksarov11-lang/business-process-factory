schema_version: "1.0"
roles:
  - role_id: ROLE-HR-KDP-001
    canonical_name: "Ведущий специалист по кадровому делопроизводству"
    department: "Администрация"
    aliases:
      - "кадровик"
      - "кадровый сотрудник"
      - "сотрудник кадровой службы"
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    notes: "Интервьюируемая роль SRC-HR-KDP-001. SRC-HR-DIR-001 подтверждает, что роль находится в подчинении директора по персоналу и участвует в кадровом делопроизводстве по приемам, увольнениям, переводам и иным движениям."

  - role_id: ROLE-HR-DIRECTOR-001
    canonical_name: "Директор по персоналу"
    department: UNKNOWN
    aliases: []
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    notes: "Интервьюируемая роль SRC-HR-DIR-001. SRC-HR-KDP-001 подтверждает ее как руководителя ведущего специалиста по кадровому делопроизводству и источник исходных данных для оформления приема."

  - role_id: ROLE-HIRING-MANAGER-001
    canonical_name: "Непосредственный руководитель"
    department: UNKNOWN
    aliases:
      - "непосредственный руководитель вакансии"
    source_refs: [SRC-HR-DIR-001]
    notes: "Подтвержден как инициатор заявки на вакантную позицию, согласующий профиль и участник второго этапа собеседования. Конкретная должность зависит от вакансии."

  - role_id: ROLE-CANDIDATE-001
    canonical_name: "Соискатель"
    department: UNKNOWN
    aliases:
      - "кандидат"
      - "выбранный соискатель"
    source_refs: [SRC-HR-DIR-001]
    notes: "Участник процесса подбора до возникновения роли сотрудника. Не объединяется с ROLE-EMPLOYEE-001 до фактического выхода/оформления."

  - role_id: ROLE-FIN-CHIEF-ACCOUNTANT-001
    canonical_name: "Главный бухгалтер"
    department: UNKNOWN
    aliases:
      - "бухгалтер, главный бухгалтер"
    source_refs: [SRC-HR-KDP-001]
    notes: "Получает уведомление о сформированной отчетности по приему/увольнению и сообщает о ее сдаче."

  - role_id: ROLE-CEO-001
    canonical_name: "Генеральный директор"
    department: UNKNOWN
    aliases:
      - "генеральный директор"
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    notes: "SRC-HR-KDP-001 подтверждает подписание трудового договора и возможное подписание трудовой книжки; SRC-HR-DIR-001 — подписание графика отпусков и согласование локальных нормативных актов."

  - role_id: ROLE-EMPLOYEE-001
    canonical_name: "Сотрудник"
    department: UNKNOWN
    aliases:
      - "работник"
      - "военнообязанный"
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    notes: "Обобщенная роль участника кадровых событий. В SRC-HR-DIR-001 используется для адаптации, ознакомления с документами и конфликтных ситуаций; конкретная должность зависит от кейса."

  - role_id: ROLE-MIL-RESP-001
    canonical_name: "Ответственный за воинский учет"
    department: UNKNOWN
    aliases:
      - "ответственный за воинский учёт"
    source_refs: [SRC-HR-KDP-001]
    notes: "AMBIGUITY: источник подтверждает функцию/роль и подпись ответственного, но не позволяет установить, является ли это отдельным сотрудником или назначенной функцией ведущего специалиста по кадровому делопроизводству. Не объединять роли до уточнения."
