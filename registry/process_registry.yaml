schema_version: "1.0"
architecture_linkage_policy:
  L1_previous_next: "Только канонические L1↔L1 связи."
  L2_previous_next: "Только sibling L2 внутри одного parent_process."
  cross_level: "Через parent_entry/parent_exit/boundary notes, не через обычные previous_processes/next_processes."
