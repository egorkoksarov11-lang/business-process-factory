    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Необходимость первоначально поставить организацию на воинский учет"
    business_result: "Организация поставлена на воинский учет; формальный подтверждающий артефакт в источнике не назван"
    previous_processes: []
    next_processes: [HR-MIL-CHANGE-001, HR-MIL-RECON-001]
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
