schema_version: "1.0"
architecture_linkage_policy:
  L1_previous_next: "Только канонические L1↔L1 связи."
  L2_previous_next: "Только sibling L2 внутри одного parent."
  cross_level: "Через parent_entry/parent_exit/boundary_handoff, не через previous_processes/next_processes."
processes:
  - process_id: HR-STAFF-REQ-001
    name: "Формирование и согласование заявки на подбор"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Возникла потребность в сотруднике"
    business_result: "Согласованная заявка направлена HR либо зафиксирован отказ в подборе"
    previous_processes: []
    next_processes: [HR-RECRUIT-001]
    source_refs: [SRC-HR-MODEL-002, SRC-HR-MODEL-001, SRC-HR-DIR-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-MODEL-ENTRY-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: lifecycle/approval status SRC-HR-MODEL-002."
      - "UNKNOWN: обязательность согласования Генеральным директором в текущем AS-IS."

  - process_id: HR-RECRUIT-001
    name: "Подбор сотрудника на вакантную позицию"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "HR получена согласованная заявка на подбор"
    business_result: "Кандидат выбран и согласился на оффер; готов handoff в кадровое оформление"
    previous_processes: [HR-STAFF-REQ-001]
    next_processes: [HR-HIRE-001]
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001, SRC-HR-MODEL-002, SRC-HR-KDP-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001, VIEW-HR-MODEL-ENTRY-E2E-001]
    internal_flow:
      canonical_path: [HR-RECRUIT-SOURCE-001, HR-RECRUIT-SELECT-001, HR-RECRUIT-OFFER-001]
      conditional_variant: [HR-RECRUIT-SOURCE-001, HR-RECRUIT-SELECT-001, HR-RECRUIT-SEC-001, HR-RECRUIT-OFFER-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: applicability HR-RECRUIT-SEC-001; reference-only source lifecycle UNKNOWN."
      - "UNKNOWN: условное согласование оффера Генеральным директором."
      - "UNKNOWN: точный состав handoff в HR-HIRE-001."

  - process_id: HR-RECRUIT-SOURCE-001
    name: "Поиск и привлечение кандидатов"
    domain: HR
    level: L2
    parent_process: HR-RECRUIT-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Parent HR-RECRUIT-001 запущен и требования готовы к поиску"
    business_result: "Получены кандидаты/отклики для отбора"
    previous_processes: []
    next_processes: [HR-RECRUIT-SELECT-001]
    parent_entry_handoff:
      from_l1: HR-STAFF-REQ-001
      via_parent: HR-RECRUIT-001
    architecture_applicability:
      mode: CANONICAL_L2
      as_is_applicability: SUPPORTED_BY_INTERVIEW
      source_confidence: INTERVIEW_SUPPORTED
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: полный набор каналов поиска."]

  - process_id: HR-RECRUIT-SELECT-001
    name: "Отбор, собеседования и выбор кандидата"
    domain: HR
    level: L2
    parent_process: HR-RECRUIT-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Получены кандидаты для оценки"
    business_result: "Выбран кандидат для оффера либо условной проверки СБ"
    previous_processes: [HR-RECRUIT-SOURCE-001]
    next_processes: [HR-RECRUIT-OFFER-001]
    conditional_next_processes:
      - process_ref: HR-RECRUIT-SEC-001
        applicability: UNKNOWN
        source_ref: SRC-HR-MODEL-001
    architecture_applicability:
      mode: CANONICAL_L2
      as_is_applicability: SUPPORTED_BY_INTERVIEW
      source_confidence: INTERVIEW_SUPPORTED
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: критерии отбора/финального выбора.", "UNKNOWN: когда применима проверка СБ."]

  - process_id: HR-RECRUIT-SEC-001
    name: "Проверка кандидата службой безопасности"
    domain: HR
    level: L2
    parent_process: HR-RECRUIT-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Если проверка СБ применима, выбранный кандидат передан на проверку"
    business_result: "Получен результат проверки о наличии/отсутствии негативной информации"
    previous_processes: [HR-RECRUIT-SELECT-001]
    next_processes: [HR-RECRUIT-OFFER-001]
    architecture_applicability:
      mode: CONDITIONAL_REFERENCE_DERIVED
      as_is_applicability: UNKNOWN
      source_confidence: REFERENCE_ONLY
      source_lifecycle_status: UNKNOWN
    source_refs: [SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: действует ли этот L2 в AS-IS и для каких случаев.", "UNKNOWN: артефакт результата проверки."]

  - process_id: HR-RECRUIT-OFFER-001
    name: "Формирование, согласование и принятие оффера"
    domain: HR
    level: L2
    parent_process: HR-RECRUIT-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Кандидат выбран; результат проверки учитывается только при ее применимости"
    business_result: "Оффер принят либо сформирован результат для возврата к поиску"
    previous_processes: [HR-RECRUIT-SELECT-001]
    next_processes: []
    conditional_previous_processes:
      - process_ref: HR-RECRUIT-SEC-001
        applicability: UNKNOWN
    parent_exit_handoff:
      event: "Оффер принят"
      target_l1: HR-HIRE-001
    conditional_internal_returns:
      - target_process: HR-RECRUIT-SOURCE-001
        condition: "Кандидат отказался"
        source_ref: SRC-HR-MODEL-001
      - target_process: HR-RECRUIT-SOURCE-001
        condition: "Условное согласование ГД не получено"
        applicability: UNKNOWN
        source_ref: SRC-HR-MODEL-001
    conditional_reference_rule:
      rule: "Согласование оффера ГД при негативной информации"
      applicability: UNKNOWN
      source_ref: SRC-HR-MODEL-001
    architecture_applicability:
      mode: CANONICAL_L2_WITH_REFERENCE_CONDITIONS
      source_confidence: MIXED
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: условное согласование ГД.", "UNKNOWN: фиксация принятия оффера."]

  - process_id: HR-HIRE-001
    name: "Кадровое оформление приема сотрудника"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Кандидат согласился на оффер и сведения переданы в кадровое делопроизводство"
    business_result: "Core кадровое оформление завершено; точная parent-close граница относительно MIL/SFR UNKNOWN"
    previous_processes: [HR-RECRUIT-001]
    next_processes: []
    boundary_handoff:
      event: "Фактический выход сотрудника и начало адаптации"
      target_l1: HR-ADAPT-001
      timing_relative_to_parent_close: UNKNOWN_MAY_OVERLAP
    completion_boundary:
      HR-HIRE-KDP-001: REQUIRED
      HR-HIRE-MIL-001:
        applicability: CONDITIONAL
        required_before_parent_close: UNKNOWN
      HR-HIRE-SFR-001:
        applicability: SOURCE_SUPPORTED
        required_before_parent_close: UNKNOWN
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-KDP-ROLE-001, VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001, VIEW-HR-MODEL-ENTRY-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: обязателен ли completion HR-HIRE-MIL-001 до parent close."
      - "UNKNOWN: обязателен ли completion HR-HIRE-SFR-001 до parent close."
      - "CONFLICT: распределение ответственности за СФР."
      - "CONFLICT: роль в boundary начала адаптации."

  - process_id: HR-HIRE-KDP-001
    name: "Оформление кадровых документов и данных приема"
    domain: HR
    level: L2
    parent_process: HR-HIRE-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Parent HR-HIRE-001 запущен передачей сведений о кандидате"
    business_result: "Основные кадровые данные и документы приема оформлены/подписаны"
    previous_processes: []
    next_processes: [HR-HIRE-SFR-001]
    conditional_next_processes:
      - process_ref: HR-HIRE-MIL-001
        applicability: CONDITIONAL
    parent_entry_handoff:
      from_l1: HR-RECRUIT-001
      via_parent: HR-HIRE-001
    external_boundary_handoff:
      event: "Фактический выход сотрудника"
      target_l1: HR-ADAPT-001
      routing: VIA_PARENT_ONLY
    source_refs: [SRC-HR-KDP-001, SRC-HR-MODEL-001, SRC-HR-DIR-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: точная конечная точка core оформления относительно выхода/подписей."]

  - process_id: HR-HIRE-MIL-001
    name: "Воинский учет при приеме сотрудника"
    domain: HR
    level: L2
    parent_process: HR-HIRE-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Сотрудник подпадает под применимую ветку воинского учета"
    business_result: "Связанные с приемом действия воинского учета обработаны"
    previous_processes: [HR-HIRE-KDP-001]
    next_processes: []
    architecture_applicability:
      mode: CONDITIONAL_L2
      as_is_applicability: CONDITIONAL
      source_confidence: INTERVIEW_SUPPORTED
      parent_completion_dependency: UNKNOWN
    source_refs: [SRC-HR-KDP-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: identity ROLE-MIL-RESP-001.", "UNKNOWN: критерий применимости.", "UNKNOWN: dependency parent close."]

  - process_id: HR-HIRE-SFR-001
    name: "Подготовка и отправка сведений о приеме в СФР"
    domain: HR
    level: L2
    parent_process: HR-HIRE-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Событие приема оформлено и доступны сведения для СФР"
    business_result: "Сведения отправлены и подтверждение сдачи зафиксировано в пределах источников"
    previous_processes: [HR-HIRE-KDP-001]
    next_processes: []
    architecture_applicability:
      mode: CANONICAL_L2
      source_confidence: INTERVIEW_AND_REFERENCE_WITH_ROLE_CONFLICT
      parent_completion_dependency: UNKNOWN
    source_refs: [SRC-HR-KDP-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions: ["CONFLICT: кто готовит/отправляет.", "UNKNOWN: dependency parent close."]

  - process_id: HR-ADAPT-001
    name: "Сопровождение адаптации и испытательного срока сотрудника"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Фактический выход сотрудника и начало периода адаптации/испытательного срока"
    business_result: "Период проконтролирован, обратная связь получена, негативные моменты в зоне HR отработаны; формальный итог UNKNOWN"
    previous_processes: []
    next_processes: []
    boundary_handoff_from:
      source_l1: HR-HIRE-001
      event: "Фактический выход сотрудника"
      relation_to_source_completion: UNKNOWN_MAY_OVERLAP
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001, VIEW-HR-MODEL-ENTRY-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions: ["CONFLICT: role boundary КДП vs Директор.", "UNKNOWN: formal result/feedback source.", "UNKNOWN: timing relative to HR-HIRE-001 close."]

  - process_id: HR-TERM-001
    name: "Прекращение трудовых отношений с сотрудником"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Возникновение подтвержденного основания прекращения трудовых отношений"
    business_result: "Трудовые отношения прекращены и кадровое оформление завершено"
    previous_processes: []
    next_processes: []
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-KDP-ROLE-001, VIEW-HR-DIRECTOR-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: полный перечень сценариев и границы.", "UNKNOWN: граница полного расчета и передачи дел.", "UNKNOWN: подписант приказа из-за source issue."]

  - process_id: HR-MIL-ORG-001
    name: "Постановка организации на воинский учет"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Необходимость первоначально поставить организацию на воинский учет"
    business_result: "Организация поставлена на воинский учет; формальный подтверждающий артефакт UNKNOWN"
    previous_processes: []
    next_processes: [HR-MIL-CHANGE-001, HR-MIL-RECON-001]
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: формальный result.", "UNKNOWN: фактический исполнитель."]

  - process_id: HR-MIL-CHANGE-001
    name: "Актуализация сведений воинского учета при изменениях данных сотрудника"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Изменение личных данных, документов, образования или должности сотрудника на воинском учете"
    business_result: "Сведения об изменениях зафиксированы и направлены в военный комиссариат"
    previous_processes: []
    next_processes: []
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: входное подтверждение изменений.", "UNKNOWN: identity ROLE-MIL-RESP-001."]

  - process_id: HR-MIL-RECON-001
    name: "Ежегодная сверка воинского учета с военным комиссариатом"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Ежегодный период сверки: начиная с 1 октября и до конца года"
    business_result: "Ежегодная сверка выполнена в пределах описанного сценария"
    previous_processes: [HR-MIL-ORG-001]
    next_processes: []
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: артефакт завершения.", "UNKNOWN: кто закрывает процесс."]

  - process_id: HR-REPORT-REQ-001
    name: "Подготовка кадрового отчета по запросу"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Поступление запроса на кадровый отчет"
    business_result: "Запрошенный отчет сформирован и отправлен инициатору"
    previous_processes: []
    next_processes: []
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-FUNCTION-001, VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions: ["UNKNOWN: инициаторы/потребители.", "UNKNOWN: каналы запроса/отправки."]

architecture_candidates:
  - candidate_id: CAND-HR-MOVE-001
    working_name: "Оформление перевода / кадрового перемещения"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_UNKNOWN
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    evidence_note: "Оба интервью подтверждают область работы, но последовательность не раскрыта."
    missing_for_canonicalization: ["trigger", "business result", "consumer", "границы и handoff", "различие видов перемещений"]
  - candidate_id: CAND-HR-WORKFORCE-001
    working_name: "Управление изменением штатной численности"
