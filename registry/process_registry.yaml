  - candidate_id: CAND-HR-FOT-001
    working_name: "Ежемесячный контроль фонда оплаты труда"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_REVIEW_REQUIRED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Таблица ФОТ передается на согласование, потребитель/граница UNKNOWN."
    missing_for_canonicalization: ["календарный trigger", "согласующий", "граница"]
  - candidate_id: CAND-HR-CORP-EVENT-001
    working_name: "Организация корпоративного мероприятия"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_REVIEW_REQUIRED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Программа/место/бюджет/проведение/отчет названы; trigger/consumer UNKNOWN."
