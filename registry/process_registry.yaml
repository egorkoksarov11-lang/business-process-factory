schema_version: "1.0"
processes:
  - process_id: HR-RECRUIT-001
    name: "Подбор сотрудника на вакантную позицию"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Поступление директору по персоналу заявки от непосредственного руководителя на вакантную позицию"
    business_result: "Кандидат выбран, оффер подготовлен; источник подтверждает последующий выход выбранного кандидата в назначенное время на определенных условиях, но момент подтверждения оффера остается UNKNOWN"
    previous_processes: []
    next_processes: [HR-HIRE-001]
    source_refs: [SRC-HR-DIR-001, SRC-HR-KDP-001]
    views: [VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: каким событием подтверждается завершение подбора — выбор кандидата, принятие оффера или подтверждение даты выхода?"
      - "UNKNOWN: когда и в каком составе сведения о выбранном кандидате передаются в кадровое делопроизводство?"

  - process_id: HR-HIRE-001
    name: "Кадровое оформление приема сотрудника"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Поступление в кадровое делопроизводство сведений о выбранном кандидате для оформления приема перед выходом/началом работы"
    business_result: "Прием сотрудника кадрово оформлен; связанные с событием приема кадровые документы, отчетность и условная ветка воинского учета обработаны в пределах подтвержденной источниками границы"
    previous_processes: [HR-RECRUIT-001]
    next_processes: [HR-ADAPT-001]
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    views: [VIEW-HR-KDP-ROLE-001, VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: точная точка handoff из HR-RECRUIT-001 — после выбора кандидата, после принятия оффера или непосредственно перед датой выхода."
      - "UNKNOWN: является ли подтверждение отправки сведений в СФР обязательной конечной точкой HR-HIRE-001 или контрольным завершением L2 внутри приема?"
      - "UNKNOWN: является ли ответственный за воинский учет отдельной ролью или функцией текущего кадрового специалиста?"

  - process_id: HR-ADAPT-001
    name: "Сопровождение адаптации и испытательного срока сотрудника"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Выход выбранного сотрудника на работу и начало периода адаптации/испытательного срока"
    business_result: "Период адаптации/испытательного срока проконтролирован, обратная связь получена, а выявленные негативные моменты в зоне ответственности директора по персоналу отработаны; дальнейшее решение по результатам периода в источнике не раскрыто"
    previous_processes: [HR-HIRE-001]
    next_processes: []
    source_refs: [SRC-HR-DIR-001]
    views: [VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: кто предоставляет директору по персоналу итоговую обратную связь по адаптации/испытательному сроку?"
      - "UNKNOWN: какой формальный результат или решение завершает период адаптации/испытательного срока?"
      - "UNKNOWN: начинается ли HR-ADAPT-001 только после полного завершения HR-HIRE-001 или процессы частично пересекаются во времени в дату выхода?"

  - process_id: HR-TERM-001
    name: "Прекращение трудовых отношений с сотрудником"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Возникновение подтвержденного источниками основания прекращения трудовых отношений: заявление сотрудника; сокращение штата/снижение численности; договоренность с сотрудником. Полный перечень оснований остается UNKNOWN"
    business_result: "Трудовые отношения прекращены и кадровое оформление прекращения завершено; для подробно раскрытого сценария по заявлению сотрудника подтверждены выдача документов и подготовка связанной отчетности"
    previous_processes: []
    next_processes: []
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    views: [VIEW-HR-KDP-ROLE-001, VIEW-HR-DIRECTOR-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: полный перечень сценариев прекращения трудовых отношений и их архитектурные различия."
      - "UNKNOWN: кто отвечает за полный расчет в последний рабочий день и является ли расчет частью границы HR-TERM-001 или соседнего процесса?"
      - "UNKNOWN: кто подписывает приказ об увольнении; SRC-HR-KDP-001 содержит неоднозначную/ошибочную фразу про приказ о приеме после заявления об увольнении."
      - "UNKNOWN: принадлежит ли передача дел замещающему сотруднику HR-TERM-001 или процессу подразделения увольняющегося сотрудника?"
      - "UNKNOWN: как трактовать поврежденный фрагмент SRC-HR-DIR-001 о вариантах сокращения/увольнения; он не использован для создания отдельного сценария."

  - process_id: HR-MIL-ORG-001
    name: "Постановка организации на воинский учет"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Необходимость первоначально поставить организацию на воинский учет"
    business_result: "Организация поставлена на воинский учет; вывод основан на заявленной цели блока и последующем переходе к текущему ведению учета, при этом формальный подтверждающий артефакт в источнике не назван"
    previous_processes: []
    next_processes: [HR-MIL-CHANGE-001, HR-MIL-RECON-001]
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: какой формальный результат/подтверждение означает, что постановка организации на учет завершена?"
      - "UNKNOWN: выполняет ли этот процесс текущий ведущий специалист или отдельный назначенный ответственный за воинский учет?"

  - process_id: HR-MIL-CHANGE-001
    name: "Актуализация сведений воинского учета при изменениях данных сотрудника"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Изменение личных данных, документов, образования или должности сотрудника, состоящего на воинском учете"
    business_result: "Сведения об изменениях зафиксированы и направлены письмом в военный комиссариат"
    previous_processes: []
    next_processes: []
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: каким образом кадровая служба получает достоверное сообщение об изменении данных сотрудника и что является входным подтверждением изменения?"
      - "UNKNOWN: является ли ответственный за воинский учет отдельной ролью или функцией ведущего специалиста по кадровому делопроизводству?"

  - process_id: HR-MIL-RECON-001
    name: "Ежегодная сверка воинского учета с военным комиссариатом"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Ежегодный период сверки: начиная с 1 октября и до конца года"
    business_result: "Ежегодная сверка с военным комиссариатом выполнена, а подготовленные документы переданы на согласование/получены после согласования в пределах описанного источником сценария"
    previous_processes: [HR-MIL-ORG-001]
    next_processes: []
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: какой конкретный артефакт или отметка подтверждает завершение ежегодной сверки?"
      - "UNKNOWN: кто именно забирает согласованные документы и закрывает процесс?"

  - process_id: HR-REPORT-REQ-001
    name: "Подготовка кадрового отчета по запросу"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Поступление запроса на кадровый отчет"
    business_result: "Запрошенный кадровый отчет сформирован и отправлен инициатору запроса"
    previous_processes: []
    next_processes: []
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: какие роли/подразделения являются инициаторами и потребителями кадровых отчетов?"
      - "UNKNOWN: через какие каналы поступают запросы и отправляются результаты?"

architecture_candidates:
  - candidate_id: CAND-HR-MOVE-001
    working_name: "Оформление перевода / кадрового перемещения"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_UNKNOWN
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    evidence_note: "Оба источника подтверждают переводы/кадровые движения как область работы; SRC-HR-KDP-001 также упоминает перевод в воинской отчетности, но ни один источник не раскрывает достаточную кадровую последовательность."
    missing_for_canonicalization:
      - "самостоятельный trigger"
      - "полный business result"
      - "consumer результата"
      - "границы и основные передачи ответственности"
      - "различие между переводом и иными кадровыми перемещениями"

  - candidate_id: CAND-HR-WORKFORCE-001
    working_name: "Управление изменением штатной численности"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_UNKNOWN
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Изменение объема задач компании связывается с увеличением/снижением штатной численности; увеличение ведет к подбору, снижение — к сокращению/прекращению отношений. Сам процесс принятия решения о численности не раскрыт."
    missing_for_canonicalization:
      - "кто инициирует и принимает решение об изменении численности"
      - "какой артефакт/результат фиксирует новое требование к численности"
      - "точный handoff в HR-RECRUIT-001 или HR-TERM-001"

  - candidate_id: CAND-HR-LEAVE-SCHEDULE-001
    working_name: "Формирование и утверждение графика отпусков"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_REVIEW_REQUIRED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Источник описывает самостоятельный ежегодный блок: составить график до середины декабря, ознакомить сотрудников, подписать у генерального директора. Требуется отдельный архитектурный проход до канонизации."
    missing_for_canonicalization:
      - "точный календарный trigger/начало процесса"
      - "входные данные и участники формирования графика"
      - "конечный потребитель/точка завершения после подписания и ознакомления"

  - candidate_id: CAND-HR-LNA-001
    working_name: "Управление локальными нормативными актами"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_REVIEW_REQUIRED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Источник объединяет контроль наличия ЛНА, создание/редактирование, согласование с генеральным директором, ознакомление работников и последующее применение. Нужна проверка, является ли это одним lifecycle-процессом или несколькими управленческими сценариями."
    missing_for_canonicalization:
      - "триггеры создания и изменения ЛНА"
      - "граница между поддержанием актуальности и применением ЛНА в конфликтных ситуациях"
      - "точный бизнес-результат одного цикла"

  - candidate_id: CAND-HR-CONFLICT-001
    working_name: "Урегулирование конфликтных и дисциплинарных ситуаций"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_REVIEW_REQUIRED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Описаны досудебные личностные конфликты и судебная поддержка юристов, но источник смешивает внутреннее урегулирование и участие HR в юридическом процессе."
    missing_for_canonicalization:
      - "единая или раздельная граница досудебного и судебного сценариев"
      - "бизнес-результат HR в судебной ветке"
      - "handoff к юридической функции"

  - candidate_id: CAND-HR-INSPECTION-001
    working_name: "Подготовка кадровых документов по запросу государственного органа"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_REVIEW_REQUIRED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Подтверждена подготовка выписок, копий и регламентов по списку налоговой или трудовой инспекции; не раскрыта точка получения запроса и завершение передачи ответа."
    missing_for_canonicalization:
      - "канал/роль получения запроса"
      - "кто проверяет и отправляет пакет"
      - "точка завершения процесса"

  - candidate_id: CAND-HR-FOT-001
    working_name: "Ежемесячный контроль фонда оплаты труда"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_REVIEW_REQUIRED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Директор по персоналу ежемесячно ведет учет выплат по каждому сотруднику и передает заполненную таблицу ФОТ на согласование выплаты; роль получателя/согласующего не названа."
    missing_for_canonicalization:
      - "инициирующий календарный момент"
      - "роль потребителя/согласующего"
      - "граница после передачи таблицы на согласование"

  - candidate_id: CAND-HR-CORP-EVENT-001
    working_name: "Организация корпоративного мероприятия"
    domain: HR
    proposed_level: L1
    status: BOUNDARY_REVIEW_REQUIRED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Источник описывает программу, место, формат, согласование бюджета, проведение и отчет по расходам; требуется уточнить инициирование и потребителя результата до канонизации."
    missing_for_canonicalization:
      - "trigger конкретного мероприятия"
      - "роль, согласующая бюджет"
      - "формальная точка закрытия после отчета по расходам"

  - candidate_id: CAND-HR-TIME-LEAVE-001
    working_name: "Табелирование и учет отпусков/больничного времени"
    domain: HR
    proposed_level: L1
    status: INSUFFICIENTLY_DESCRIBED
    source_refs: [SRC-HR-DIR-001]
    evidence_note: "Темы только перечислены внутри контроля кадрового делопроизводства. Не создавать отдельные process_id для табеля, отпуска или больничного без самостоятельных trigger/result/consumer."
    missing_for_canonicalization:
      - "границы"
      - "триггеры"
      - "бизнес-результаты"
      - "участники и handoff"
