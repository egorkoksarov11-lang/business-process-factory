    evidence_note: "HR-STAFF-REQ-001 теперь покрывает конкретный цикл от потребности до согласованной заявки/отказа. Более широкий контур изменения штатной численности компании остается кандидатом: SRC-HR-DIR-001 связывает изменение объема задач с увеличением/снижением численности, но управленческое решение о целевой численности не раскрыто."
    missing_for_canonicalization: ["владелец решения о численности", "результат планирования численности", "граница относительно отдельных заявок и сокращений"]

