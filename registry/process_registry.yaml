schema_version: "1.0"
processes:
  - process_id: HR-STAFF-REQ-001
    name: "Формирование и согласование заявки на подбор"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Возникла потребность в сотруднике"
    business_result: "Согласованная заявка на подбор направлена HR либо зафиксирован результат 'подбор сотрудника не согласован'"
    previous_processes: []
    next_processes: [HR-RECRUIT-001]
    source_refs: [SRC-HR-MODEL-002, SRC-HR-MODEL-001, SRC-HR-DIR-001]
    views: [VIEW-HR-MODEL-ENTRY-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: является ли схема SRC-HR-MODEL-002 действующим AS-IS, TO-BE или иным reference-state; lifecycle/approval status источника не подтвержден."
      - "UNKNOWN: обязательно ли согласование Генеральным директором в текущей фактической практике или это правило только существующей схемы."

  - process_id: HR-RECRUIT-001
    name: "Подбор сотрудника на вакантную позицию"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "HR получена согласованная заявка на подбор"
    business_result: "Кандидат выбран и согласился на оффер; кандидат готов к передаче в кадровое оформление приема"
    previous_processes: [HR-STAFF-REQ-001]
    next_processes: [HR-HIRE-001]
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001, SRC-HR-MODEL-002, SRC-HR-KDP-001]
    views: [VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001, VIEW-HR-MODEL-ENTRY-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: какой состав данных и документов передается из подбора в HR-HIRE-001 после принятия оффера."
      - "UNKNOWN: является ли проверка Службой безопасности обязательной частью текущего AS-IS или только элементом reference-модели SRC-HR-MODEL-001."
      - "UNKNOWN: является ли условное согласование оффера Генеральным директором при негативной информации действующим правилом."
      - "UNKNOWN: lane 'HR' в SRC-HR-MODEL-001 соответствует Директору по персоналу или более широкой HR-функции."

  - process_id: HR-RECRUIT-SOURCE-001
    name: "Поиск и привлечение кандидатов"
    domain: HR
    level: L2
    parent_process: HR-RECRUIT-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Согласованная заявка и требования к вакансии готовы для поиска"
    business_result: "Сформирован поток/пул кандидатов для дальнейшего отбора"
    previous_processes: [HR-STAFF-REQ-001]
    next_processes: [HR-RECRUIT-SELECT-001]
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: полный набор каналов поиска помимо HeadHunter."

  - process_id: HR-RECRUIT-SELECT-001
    name: "Отбор, собеседования и выбор кандидата"
    domain: HR
    level: L2
    parent_process: HR-RECRUIT-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Получены кандидаты для оценки"
    business_result: "Выбран кандидат для последующей проверки/подготовки оффера"
    previous_processes: [HR-RECRUIT-SOURCE-001]
    next_processes: [HR-RECRUIT-SEC-001]
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: критерии перехода кандидата между этапами и критерии финального выбора."

  - process_id: HR-RECRUIT-SEC-001
    name: "Проверка кандидата службой безопасности"
    domain: HR
    level: L2
    parent_process: HR-RECRUIT-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Кандидат выбран для проверки перед оффером согласно SRC-HR-MODEL-001"
    business_result: "Получен результат проверки о наличии/отсутствии негативной информации"
    previous_processes: [HR-RECRUIT-SELECT-001]
    next_processes: [HR-RECRUIT-OFFER-001]
    source_refs: [SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: lifecycle/approval status SRC-HR-MODEL-001 и фактическая обязательность проверки СБ."
      - "UNKNOWN: что именно считается негативной информацией и какой артефакт фиксирует результат; Agent 01 это не достраивает."

  - process_id: HR-RECRUIT-OFFER-001
    name: "Формирование, согласование и принятие оффера"
    domain: HR
    level: L2
    parent_process: HR-RECRUIT-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Кандидат выбран и получен результат требуемой проверки"
    business_result: "Кандидат согласился на оффер либо инициирован возврат к поиску при отказе/несогласовании"
    previous_processes: [HR-RECRUIT-SEC-001]
    next_processes: [HR-HIRE-001, HR-RECRUIT-SOURCE-001]
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: кто утверждает стандартные условия оффера без негативной информации."
      - "UNKNOWN: фактическое правило условного согласования Генеральным директором при негативной информации."

  - process_id: HR-HIRE-001
    name: "Кадровое оформление приема сотрудника"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Кандидат согласился на оффер и сведения о кандидате/условиях переданы в кадровое делопроизводство"
    business_result: "Кадровое оформление приема завершено; применимые ветки воинского учета и отчетности в СФР обработаны в подтвержденной источниками границе"
    previous_processes: [HR-RECRUIT-001]
    next_processes: [HR-ADAPT-001]
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: [VIEW-HR-KDP-ROLE-001, VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001, VIEW-HR-MODEL-ENTRY-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: точный состав handoff после принятия оффера."
      - "CONFLICT: распределение ответственности за подготовку/отправку отчетности в СФР различается между SRC-HR-KDP-001 и SRC-HR-MODEL-001."
      - "UNKNOWN: является ли ответственный за воинский учет отдельной ролью или функцией кадрового специалиста."
      - "CONFLICT/AMBIGUITY: SRC-HR-MODEL-001 размещает 'контроль выхода и начало адаптации' в lane Кадровика, а SRC-HR-DIR-001 относит контроль адаптации к Директору по персоналу."

  - process_id: HR-HIRE-KDP-001
    name: "Оформление кадровых документов и данных приема"
    domain: HR
    level: L2
    parent_process: HR-HIRE-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "В кадровое делопроизводство переданы сведения о кандидате, согласившемся на оффер"
    business_result: "Основные кадровые данные и документы приема оформлены и подписаны в пределах подтвержденного источниками сценария"
    previous_processes: [HR-RECRUIT-001]
    next_processes: [HR-HIRE-MIL-001, HR-HIRE-SFR-001, HR-ADAPT-001]
    source_refs: [SRC-HR-KDP-001, SRC-HR-MODEL-001, SRC-HR-DIR-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: точная конечная точка этого L2 относительно подписания всех документов и даты фактического выхода."

  - process_id: HR-HIRE-MIL-001
    name: "Воинский учет при приеме сотрудника"
    domain: HR
    level: L2
    parent_process: HR-HIRE-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Принимаемый сотрудник подпадает под применимую ветку воинского учета"
    business_result: "Действия и документы воинского учета, связанные с событием приема, обработаны и требуемые сведения направлены в пределах описанного сценария"
    previous_processes: [HR-HIRE-KDP-001]
    next_processes: []
    source_refs: [SRC-HR-KDP-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: ROLE-MIL-RESP-001 — отдельная роль или функция ROLE-HR-KDP-001."
      - "UNKNOWN: точный критерий применимости ветки; Agent 01 не достраивает его из законодательства."

  - process_id: HR-HIRE-SFR-001
    name: "Подготовка и отправка сведений о приеме в СФР"
    domain: HR
    level: L2
    parent_process: HR-HIRE-001
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Событие приема оформлено и доступны сведения для отчетности в СФР"
    business_result: "Сведения о приеме отправлены в СФР и получено/зафиксировано подтверждение сдачи в пределах описанных источников"
    previous_processes: [HR-HIRE-KDP-001]
    next_processes: []
    source_refs: [SRC-HR-KDP-001, SRC-HR-MODEL-001]
    views: []
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "CONFLICT: SRC-HR-KDP-001 — кадровик формирует сведения и передает Главному бухгалтеру на отправку; SRC-HR-MODEL-001 — 'подготовка и отправка' целиком расположена в lane Главного бухгалтера."
      - "UNKNOWN: фактическая граница ответственности и система/действие, фиксирующее успешную сдачу."

  - process_id: HR-ADAPT-001
    name: "Сопровождение адаптации и испытательного срока сотрудника"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Фактический выход сотрудника и начало периода адаптации/испытательного срока"
    business_result: "Период адаптации/испытательного срока проконтролирован, обратная связь получена, выявленные негативные моменты в зоне HR отработаны; формальное решение по итогам периода остается UNKNOWN"
    previous_processes: [HR-HIRE-001]
    next_processes: []
    source_refs: [SRC-HR-DIR-001, SRC-HR-MODEL-001]
    views: [VIEW-HR-DIRECTOR-ROLE-001, VIEW-HR-HIRE-E2E-001, VIEW-HR-MODEL-ENTRY-E2E-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "CONFLICT/AMBIGUITY: SRC-HR-MODEL-001 размещает 'контроль выхода и начало адаптации' у Кадровика, SRC-HR-DIR-001 относит контроль адаптации к Директору по персоналу."
      - "UNKNOWN: является ли элемент модели только handoff/контролем выхода либо описывает участие Кадровика в полном HR-ADAPT-001."
      - "UNKNOWN: кто предоставляет итоговую обратную связь и какой формальный результат закрывает испытательный срок."

  - process_id: HR-TERM-001
    name: "Прекращение трудовых отношений с сотрудником"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Возникновение подтвержденного источниками основания прекращения трудовых отношений: заявление сотрудника; сокращение штата/снижение численности; договоренность с сотрудником. Полный перечень оснований остается UNKNOWN"
    business_result: "Трудовые отношения прекращены и кадровое оформление прекращения завершено; для подробно раскрытого сценария по заявлению сотрудника подтверждены выдача документов и подготовка связанной отчетности"
    previous_processes: []
    next_processes: []
    source_refs: [SRC-HR-KDP-001, SRC-HR-DIR-001]
    views: [VIEW-HR-KDP-ROLE-001, VIEW-HR-DIRECTOR-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: полный перечень сценариев прекращения трудовых отношений и их архитектурные различия."
      - "UNKNOWN: граница полного расчета и передачи дел."
      - "UNKNOWN: кто подписывает приказ об увольнении; SRC-HR-KDP-001 содержит противоречивую фразу."

