    business_result: "Ежегодная сверка с военным комиссариатом выполнена в пределах описанного источником сценария"
    previous_processes: [HR-MIL-ORG-001]
    next_processes: []
    source_refs: [SRC-HR-KDP-001]
    views: [VIEW-HR-KDP-ROLE-001]
    as_is_version: null
    to_be_version: null
    blocking_questions:
      - "UNKNOWN: конкретный артефакт/отметка завершения сверки."
      - "UNKNOWN: кто закрывает процесс после согласования документов."

  - process_id: HR-REPORT-REQ-001
    name: "Подготовка кадрового отчета по запросу"
    domain: HR
    level: L1
    status: ARCHITECTURE_READY
    owner_role: UNKNOWN
    trigger: "Поступление запроса на кадровый отчет"
