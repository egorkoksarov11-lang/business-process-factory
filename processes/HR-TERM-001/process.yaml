open_questions:
  - "Каков полный перечень фактических сценариев прекращения трудовых отношений и какие из них требуют отдельных L2?"
  - "Кто инициирует и утверждает сокращение штата/численности и какой вход передается в HR-TERM-001?"
  - "Кто отвечает за полный расчет в последний рабочий день и входит ли расчет в границу HR-TERM-001 или в соседний процесс?"
  - "Кто подписывает приказ об увольнении? SRC-HR-KDP-001 содержит внутренне противоречивую фразу 'приказ о приеме подписывается после ... заявления об увольнении'."
  - "Является ли передача дел замещающему сотруднику управляемой частью HR-TERM-001 или соседним процессом подразделения сотрудника?"
  - "Как обрабатывается воинский учет при прекращении отношений и кто выполняет соответствующую условную ветку?"

