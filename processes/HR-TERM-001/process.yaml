schema_version: "1.0"

process:
  process_id: "HR-TERM-001"
  name: "Прекращение трудовых отношений с сотрудником"
  domain: "HR"
  level: "L1"
  status: "ARCHITECTURE_READY"
  parent_process: null
  owner_role: UNKNOWN
  participants:
    - ROLE-EMPLOYEE-001
    - ROLE-HR-KDP-001
    - ROLE-HR-DIRECTOR-001
    - ROLE-FIN-CHIEF-ACCOUNTANT-001
    - ROLE-CEO-001
    - ROLE-MIL-RESP-001
  views:
    - VIEW-HR-KDP-ROLE-001
    - VIEW-HR-DIRECTOR-ROLE-001

boundaries:
  trigger: "Возникновение подтвержденного источниками основания прекращения трудовых отношений: заявление сотрудника; сокращение штата/снижение численности; договоренность с сотрудником. Полный перечень оснований остается UNKNOWN"
  input:
    - "Основание прекращения трудовых отношений; конкретный вход зависит от сценария"
    - "Для сценария по инициативе сотрудника: заявление сотрудника об увольнении"
    - "Для сценария снижения численности: потребность/решение о сокращении штата, точный документ и инициатор UNKNOWN"
  previous_processes: []
  business_result: "Трудовые отношения прекращены и кадровое оформление прекращения завершено; для подробно раскрытого сценария по заявлению сотрудника подтверждены выдача документов и подготовка связанной отчетности"
  consumer: "Сотрудник и организация"
  next_processes: []

sources:
  source_refs:
    - SRC-HR-KDP-001
    - SRC-HR-DIR-001
  evidence_refs:
    - "sources/evidence/SRC-HR-KDP-001_architecture.yaml"
    - "sources/evidence/SRC-HR-DIR-001_architecture.yaml"

architecture_evidence:
  - source_ref: SRC-HR-KDP-001
    evidence_class: EXPLICIT
    statement: "Подробно раскрыт сценарий увольнения по заявлению сотрудника: заявление, кадровое оформление, выдача документов, отчетность и условные связанные действия."
  - source_ref: SRC-HR-DIR-001
    evidence_class: EXPLICIT
    statement: "Директор по персоналу связывает снижение объема задач со снижением штатной численности и называет сокращение штата, увольнение и договоренность с сотрудниками как варианты прекращения отношений; один фрагмент распознан неясно."
  - source_ref: "SRC-HR-KDP-001 + SRC-HR-DIR-001"
    evidence_class: INFERRED
    statement: "Канонический L1 расширен с узкого 'оформления увольнения по заявлению' до 'прекращения трудовых отношений', а подтвержденные основания трактуются как сценарии/L2 внутри одного L1, а не как отдельные процессы."

architecture_decomposition:
  - scenario_id: TERM-SCENARIO-EMPLOYEE-INITIATED
    classification: "L2 scenario"
    source_refs: [SRC-HR-KDP-001]
    readiness: "DETAIL_AVAILABLE_FOR_AGENT_02"
    note: "Сценарий увольнения по инициативе сотрудника раскрыт существенно подробнее остальных."
  - scenario_id: TERM-SCENARIO-REDUCTION
    classification: "L2 candidate scenario"
    source_refs: [SRC-HR-DIR-001]
    readiness: "BOUNDARY_ONLY"
    note: "Подтверждено наличие сценария сокращения штата/численности, но последовательность и документы не раскрыты."
  - scenario_id: TERM-SCENARIO-AGREEMENT
    classification: "L2 candidate scenario"
    source_refs: [SRC-HR-DIR-001]
    readiness: "BOUNDARY_ONLY"
    note: "Подтверждена договоренность с сотрудниками как вариант; последовательность и юридическая форма UNKNOWN."
  - scenario_id: TERM-SCENARIO-UNRECOGNIZED-FRAGMENT
    classification: "source-quality ambiguity"
    source_refs: [SRC-HR-DIR-001]
    readiness: "DO_NOT_MODEL"
    note: "Фрагмент 'по закону дела ЦПТК' не интерпретируется и не превращен в отдельный сценарий."

