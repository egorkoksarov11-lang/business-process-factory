metadata:
  created_at: "2026-08-21"
  updated_at: "2026-08-21"
  notes: |
    Agent 01 classification only; detailed AS-IS intentionally not created.
    Architectural decomposition for Agent 02:
    - подготовка/подписание приказа и выдача увольнительных документов: L2 внутри увольнения;
    - формирование сведений о трудовой деятельности и уведомление главного бухгалтера: L2 внутри увольнения, не отдельный L1;
    - подтверждение сдачи отчетности главным бухгалтером: контроль/передача внутри L1 до уточнения границы;
    - действия по воинскому учету при увольнении: условная ветка, не создан отдельный L1 только из-за внешнего адресата;
    - передача дел замещающему сотруднику упомянута условно и требует определения владельца/границы.
    Source limitation: раскрыт прежде всего сценарий увольнения по инициативе сотрудника.
