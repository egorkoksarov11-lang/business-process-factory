metadata:
  created_at: "2026-08-21"
  updated_at: "2026-08-21"
  notes: |
    Agent 01 synthesis only; detailed AS-IS intentionally not created.
    Boundary decision after SRC-HR-DIR-001:
    - канонический L1 расширен с "Оформление увольнения сотрудника" до "Прекращение трудовых отношений с сотрудником";
    - отдельные основания прекращения не получают самостоятельные L1 process_id;
    - подробно описанный SRC-HR-KDP-001 сценарий по заявлению сотрудника остается L2-сценарием внутри более широкого L1;
    - сокращение/снижение численности и договоренность подтверждены только на уровне архитектурных сценариев и не должны достраиваться Agent 02 из общих знаний;
    - отчетность об увольнении, выдача отдельных документов и воинский учет не выделяются в микропроцессы.
