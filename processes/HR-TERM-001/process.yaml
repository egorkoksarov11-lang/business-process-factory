  - source_ref: SRC-HR-DIR-001
    evidence_class: EXPLICIT
    statement: "Подтверждены сокращение штата/снижение численности и договоренность с сотрудниками как варианты прекращения отношений; один фрагмент распознан неясно."
  - source_ref: "SRC-HR-KDP-001 + SRC-HR-DIR-001"
    evidence_class: INFERRED
    statement: "Канонический L1 охватывает прекращение трудовых отношений, а основания трактуются как сценарии/L2, не отдельные L1."
