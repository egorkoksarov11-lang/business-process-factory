boundaries:
  trigger: "Возникновение подтвержденного источниками основания прекращения трудовых отношений: заявление сотрудника; сокращение штата/снижение численности; договоренность с сотрудником. Полный перечень оснований остается UNKNOWN"
  input:
    - "Основание прекращения трудовых отношений; конкретный вход зависит от сценария"
    - "Для сценария по инициативе сотрудника: заявление сотрудника об увольнении"
    - "Для сценария снижения численности: потребность/решение о сокращении штата, точный документ и инициатор UNKNOWN"
  previous_processes: []
  business_result: "Трудовые отношения прекращены и кадровое оформление прекращения завершено; для подробно раскрытого сценария по заявлению сотрудника подтверждены выдача документов и подготовка связанной отчетности"
  consumer: "Сотрудник и организация"
  next_processes: []

sources:
