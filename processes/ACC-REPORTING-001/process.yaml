architecture_evidence:
  - source_ref: SRC-ACC-CHIEF-001
    evidence_class: EXPLICIT
    statement: "До отчетности Главный бухгалтер проверяет взаиморасчеты и корректность отражения операций; затем формирует декларации/отчетность, направляет их в органы, контролирует принятие и формирует электронный архив с квитанциями."

boundary_notes:
  - "Государственные сроки подтверждены как внешний регламентирующий фактор; точное фактическое событие старта подготовки в raw source не установлено и сохранено UNKNOWN в detailed AS-IS."
  - "Электронное архивирование отчетности является частью завершения этого L1, а не отдельным процессом."
  - "Detailed AS-IS различает состояния prepared, sent и accepted; отправка сама по себе не считается подтвержденным завершением процесса."

