  input:
    - "Данные бухгалтерского и налогового учета"
    - "Результаты предотчетных проверок"
  previous_processes: [ACC-PRIMARY-001]
  business_result: "Отчетность направлена в соответствующий орган, получение/принятие проконтролировано, подтверждающие файлы собраны в электронный архив"
