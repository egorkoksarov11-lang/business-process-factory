architecture_evidence:
  - source_ref: SRC-HR-DIR-001
    evidence_class: EXPLICIT
    statement: "Директор по персоналу получает заявку, формирует/согласует профиль, размещает вакансию, проводит первый этап интервью, передает кандидатов руководителю на второй этап, выбирает победителя и готовит оффер."
  - source_ref: SRC-HR-MODEL-001
    evidence_class: EXPLICIT
    statement: "Модель показывает collapsed subprocesses поиска, отбора/интервью, проверки СБ и оффера, циклы возврата к поиску и явное решение кандидата принять/не принять оффер."
  - source_ref: SRC-HR-MODEL-002
    evidence_class: EXPLICIT
    statement: "Успешный результат upstream-процесса — согласованная заявка направлена HR."
  - source_ref: SRC-HR-KDP-001
    evidence_class: EXPLICIT
    statement: "Кадровик получает от директора по персоналу сведения для оформления приема, подтверждая downstream-handoff после подбора."
  - source_ref: "SRC-HR-DIR-001 + SRC-HR-MODEL-001"
    evidence_class: UNKNOWN
    statement: "Lane 'HR' reference-модели не приписан Директору по персоналу автоматически, хотя интервью Директора подтверждает выполнение им значительной части тех же действий."

