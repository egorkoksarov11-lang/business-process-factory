  notes: |
    Agent 01 architecture only; detailed AS-IS intentionally not created.
    Внутренние действия — составление профиля, размещение на HeadHunter, получение откликов, два этапа собеседований, выбор и подготовка оффера — рассматриваются как L2-блоки/операции HR-RECRUIT-001 и не получают отдельных L1 process_id.
    Изменение штатной численности может быть upstream-контекстом, но CAND-HR-WORKFORCE-001 пока не канонизирован из-за недостатка данных о решении/результате.
