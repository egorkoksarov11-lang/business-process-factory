boundaries:
  trigger: "Поступление директору по персоналу заявки от непосредственного руководителя на вакантную позицию"
  input:
    - "Заявка непосредственного руководителя на вакантную позицию"
    - "Требования к позиции, которые уточняются/оформляются в профиль вакансии"
  previous_processes: []
  business_result: "Кандидат выбран, оффер подготовлен; источник подтверждает последующий выход выбранного кандидата в назначенное время на определенных условиях, но момент подтверждения оффера остается UNKNOWN"
  consumer: "Выбранный кандидат, непосредственный руководитель и HR-HIRE-001"
  next_processes:
    - HR-HIRE-001

sources:
  source_refs:
    - SRC-HR-DIR-001
    - SRC-HR-KDP-001
  evidence_refs:
    - "sources/evidence/SRC-HR-DIR-001_architecture.yaml"
    - "sources/evidence/SRC-HR-KDP-001_architecture.yaml"

architecture_evidence:
  - source_ref: SRC-HR-DIR-001
    evidence_class: EXPLICIT
    statement: "Директор по персоналу принимает заявку от непосредственного руководителя, формирует и согласует профиль, размещает вакансию, проводит первый этап интервью, передает кандидатов на второй этап руководителю, выбирает победителя и готовит оффер."
  - source_ref: SRC-HR-DIR-001
    evidence_class: EXPLICIT
    statement: "После выбора сотрудники выходят в назначенное время на определенных условиях."
  - source_ref: SRC-HR-KDP-001
    evidence_class: EXPLICIT
    statement: "Кадровый специалист получает от директора по персоналу данные для оформления приема, что подтверждает downstream-handoff после подбора, но не раскрывает сам подбор."
  - source_ref: "SRC-HR-DIR-001 + SRC-HR-KDP-001"
    evidence_class: INFERRED
    statement: "HR-RECRUIT-001 завершается передачей выбранного кандидата/сведений в HR-HIRE-001; точный момент handoff остается UNKNOWN."

