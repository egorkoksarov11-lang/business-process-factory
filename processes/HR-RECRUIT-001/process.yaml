  notes: |
    Agent 01 architecture only; AS-IS intentionally not created.
    Upstream boundary пересмотрена после SRC-HR-MODEL-002: поступление согласованной заявки — trigger recruitment; сама заявка вынесена в HR-STAFF-REQ-001.
