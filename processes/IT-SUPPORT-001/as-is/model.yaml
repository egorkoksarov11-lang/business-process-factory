    after_step_ref: ITSUP-A002
    question: "Обращение поступило по email?"
    branches:
      - outcome: "Да"
        next_ref: ITSUP-A003
      - outcome: "Нет / иной из текущих каналов"
        next_ref: ITSUP-A004
        note: "Отсутствие подтверждения для телефона/личного кабинета не утверждается; его наличие UNKNOWN."
    evidence_refs: [FACT-IT-LEAD-007]
