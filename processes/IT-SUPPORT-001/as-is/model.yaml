    evidence_class: EXPLICIT
    notes: "Канал передачи временного решения и критерий закрытия заявки на этом этапе UNKNOWN."

  - step_id: ITSUP-A007
    subprocess_id: IT-SUPPORT-RESOLVE-001
    role_ref: ROLE-IT-SUPPORT-EXT-001
