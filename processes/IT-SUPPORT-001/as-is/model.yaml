  applicability: "CONFIRMED_CURRENT"
  source_refs: [SRC-IT-LEAD-001]
  subprocess_refs:
    - IT-SUPPORT-INTAKE-001
    - IT-SUPPORT-RESOLVE-001
    - IT-SUPPORT-FINALIZE-001
  current_channels:
    - EMAIL
    - PHONE
    - PERSONAL_CABINET
  excluded_from_current_as_is:
