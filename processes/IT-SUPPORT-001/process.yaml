schema_version: "1.1"
process:
  process_id: "IT-SUPPORT-001"
  name: "Техническая поддержка пользователей"
  domain: "IT"
  level: "L1"
  status: "CLARIFICATION_REQUIRED"
  parent_process: null
  owner_role: UNKNOWN
  participants:
    - ROLE-INTERNAL-USER-001
    - ROLE-IT-SUPPORT-EXT-001
    - ROLE-IT-LEAD-EXT-001
  views:
    - VIEW-IT-LEAD-ROLE-001
    - VIEW-IT-FUNCTION-001

boundaries:
  trigger: "Внутреннему сотруднику требуется IT-помощь: возникла проблема либо иной запрос, и он направляет обращение в техническую поддержку"
  input:
    - "Описание проблемы/потребности сотрудника"
    - "Обращение через один из действующих каналов: личный кабинет, телефон или email"
  previous_processes: []
  business_result: "Обращение зарегистрировано и обработано; сотрудник получил постоянное решение либо временное решение, позволяющее продолжить работу, с последующей доработкой временного решения"
  consumer: "Внутренний сотрудник/пользователь и зависящие от его работы бизнес-процессы"
  next_processes: []

architecture_boundary:
  observed_channel_names:
    - "Электронная почта"
    - "Телефон"
    - "Личный кабинет"
  channels_are_processes: false
  planned_capabilities:
    - capability: "Бот корпоративного мессенджера для подачи обращений"
      status: "IN_DEVELOPMENT_NOT_AS_IS"
      source_refs: [SRC-IT-LEAD-001]
  closure_note: "Источник подтверждает последующую доработку временного решения, но не определяет точный HelpDesk-статус закрытия заявки в момент временного восстановления."
  owner_note: "Формальный владелец процесса не назван; IT lead участвует как руководитель/маршрутизатор и лично подключается к архитектурным/безопасностным вопросам."

architecture_subprocesses:
  - IT-SUPPORT-INTAKE-001
  - IT-SUPPORT-RESOLVE-001
  - IT-SUPPORT-FINALIZE-001

sources:
  source_refs: [SRC-IT-LEAD-001]
  evidence_refs:
    - "sources/evidence/SRC-IT-LEAD-001_architecture.yaml"

architecture_evidence:
  - source_ref: SRC-IT-LEAD-001
    evidence_class: EXPLICIT
    statement: "Любой внутренний сотрудник может обратиться через три текущих канала; обращение поступает в HelpDesk, получает номер, берется в работу и получает временное либо постоянное решение."
  - source_ref: SRC-IT-LEAD-001
    evidence_class: EXPLICIT
    statement: "При временном решении задача впоследствии дорабатывается, когда это возможно, до более постоянного решения."
  - source_ref: SRC-IT-LEAD-001
    evidence_class: EXPLICIT
    statement: "Повторяющиеся проблемы встречаются часто, а дублирующие заявки от нескольких сотрудников — редкая проблема."

operational_indicators:
  - indicator_id: IT-SUPPORT-RESPONSE-001
    stated_value: "30 минут"
    observed_value: "10–15 минут"
    evidence_class: EXPLICIT
    formal_sla_status: UNKNOWN
    note: "В транскрипте термин перед '30 минут' распознан неясно. Не считать формальным SLA без уточнения."

