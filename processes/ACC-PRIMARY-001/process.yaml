schema_version: "1.0"
process:
  process_id: "ACC-PRIMARY-001"
  name: "Проверка и принятие первичных документов к бухгалтерскому учету"
  domain: "ACC"
  level: "L1"
  status: "ARCHITECTURE_READY"
  parent_process: null
  owner_role: "ROLE-FIN-CHIEF-ACCOUNTANT-001"
  participants:
