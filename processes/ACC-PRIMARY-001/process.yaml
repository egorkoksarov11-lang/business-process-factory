    - ROLE-CONTRACT-OBLIGATION-RESP-001
  views:
    - VIEW-ACC-CHIEF-ROLE-001
    - VIEW-ACC-FUNCTION-001
    - VIEW-ACC-ACCOUNT-TO-REPORT-E2E-001
boundaries:
  trigger: "Первичный документ контрагента поступил в работу Главному бухгалтеру"
  input:
    - "Счета, счета-фактуры, УПД/ОПД, накладные, акты и иные первичные документы"
    - "Связанный договор/реквизиты сделки при наличии"
  previous_processes: []
  business_result: "По документу получено решение о принятии к учету; принятый документ отражен в 1С"
  consumer: "Бухгалтерский и налоговый учет организации; ACC-REPORTING-001 использует своевременно отраженные учетные данные"
  next_processes: [ACC-REPORTING-001]
architecture_subprocesses:
  - ACC-PRIMARY-CHECK-001
  - ACC-PRIMARY-APPROVE-001
  - ACC-PRIMARY-POST-001
internal_flow:
  canonical_path: [ACC-PRIMARY-CHECK-001, ACC-PRIMARY-APPROVE-001, ACC-PRIMARY-POST-001]
  evidence_class: EXPLICIT
sources:
  source_refs: [SRC-ACC-CHIEF-001]
  evidence_refs: ["sources/evidence/SRC-ACC-CHIEF-001_architecture.yaml"]
architecture_evidence:
  - source_ref: SRC-ACC-CHIEF-001
    evidence_class: EXPLICIT
    statement: "Главный бухгалтер проверяет оформление/реквизиты/суммы, направляет документ руководителю либо Финансовому директору на решение о принятии и после решения отражает его в 1С для формирования отчетности."
  - source_ref: SRC-ACC-CHIEF-001
    evidence_class: EXPLICIT
    statement: "В описании ожидания согласования источник отдельно называет руководителя, руководителя проекта или иное лицо, отвечающее за исполнение обязательств по договору; это нормализовано функционально как ROLE-CONTRACT-OBLIGATION-RESP-001, без приравнивания слова 'руководитель' к Генеральному директору."
  - source_ref: SRC-ACC-CHIEF-001
    evidence_class: EXPLICIT
    statement: "Интервьюируемая называет своевременное принятие документов к учету одним из самых важных результатов своей работы."
boundary_notes:
  - "Общий прием и маршрутизация входящих документов не включены как отдельный ACC L1 из-за смешения типов документов и неясного владельца функции."
  - "ROLE-CEO-001 не используется как участник принятия первички: источник не подтверждает, что слово 'руководитель' в этом действии означает Генерального директора."
  - "Позиция интервьюируемой, что инициатор договора должен подтверждать факт исполнения, сохранена как мнение/кандидат правила, а не как утвержденный текущий AS-IS и не как подтвержденная текущая роль."
