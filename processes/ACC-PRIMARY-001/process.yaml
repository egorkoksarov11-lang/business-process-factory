architecture_evidence:
  - source_ref: "SRC-ACC-CHIEF-001"
    evidence_class: "EXPLICIT"
    statement: "Главный бухгалтер проверяет оформление/реквизиты/суммы, направляет документ руководителю либо Финансовому директору на решение о принятии и после положительного решения отражает его в 1С для формирования отчетности."
  - source_ref: "SRC-ACC-CHIEF-001"
    evidence_class: "EXPLICIT"
    statement: "В ожидании согласования источник называет руководителя, руководителя проекта или иное лицо, отвечающее за исполнение обязательств по договору; это нормализовано как ROLE-CONTRACT-OBLIGATION-RESP-001, без приравнивания к Генеральному директору."
  - source_ref: "SRC-ACC-CHIEF-001"
    evidence_class: "EXPLICIT"
    statement: "Интервьюируемая называет своевременное принятие документов к учету одним из самых важных результатов своей работы."

boundary_notes:
  - "Общий прием и маршрутизация входящих документов не включены как отдельный ACC L1."
  - "ROLE-CEO-001 не используется как участник принятия первички: источник не подтверждает, что слово 'руководитель' в этом действии означает Генерального директора."
  - "Позиция интервьюируемой, что инициатор договора должен подтверждать факт исполнения, сохранена как NOT_CONFIRMED current rule и не включена в обязательную AS-IS роль/decision."
  - "CAND-ACC-BANK-001 и межсерверный перенос файлов не превращаются в отдельный AS-IS L1."

