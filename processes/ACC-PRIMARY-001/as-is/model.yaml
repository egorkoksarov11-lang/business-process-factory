    subprocess_id: "ACC-PRIMARY-APPROVE-001"
    role_ref: "ROLE-FIN-CHIEF-ACCOUNTANT-001"
    action: "Направить проверенный документ на согласование для получения решения о принятии к учету"
    business_object: "Проверенный первичный документ"
