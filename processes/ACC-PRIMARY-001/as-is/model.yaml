    evidence_refs: ["FACT-ACC-PRIMARY-ASIS-003", "FACT-ACC-PRIMARY-ASIS-004"]
    evidence_class: "EXPLICIT"
    notes: "Подтвержденные категории адресатов: ROLE-FIN-DIRECTOR-001 и ROLE-CONTRACT-OBLIGATION-RESP-001. ROLE-CEO-001 не используется."

