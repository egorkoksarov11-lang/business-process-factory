    action: "Проверить наличие входящего документа контрагента в ЭДО и при наличии скачать документ на сервер соответствующего юридического лица"
    business_object: "Входящий документ контрагента"
    input_information_refs: ["IO-ACC-PRIMARY-001"]
    output_information_refs: ["IO-ACC-PRIMARY-003"]
    system_refs: ["SYS-DIADOC-001", "SYS-SBIS-001"]
    channel_refs: []
    incoming_flow_refs: []
    outgoing_flow_refs: ["F001"]
    timing:
      duration: null
      deadline: null
      frequency: null
      wait_for: null
    result: "Документ доступен Главному бухгалтеру для предметной проверки; при поступлении через описанный ЭДО-контур файл скачан на сервер соответствующего юридического лица"
    evidence_refs: ["FACT-ACC-PRIMARY-ASIS-001"]
    evidence_class: "EXPLICIT"
    notes: "Не распространяет общий CAND-ACC-INBOX-001 на отдельный L1 и не утверждает, что все первичные документы поступают только через ЭДО."

