metadata:
  created_at: "2026-08-21"
  updated_at: "2026-08-21"
  notes: |
    Самостоятельный L1 создан только для изменений, имеющих собственный событийный trigger вне самого оформления приема/увольнения.
    Уведомления военкомата, непосредственно вызванные приемом или увольнением, на этой стадии не вынесены в отдельные L1: они остаются условными ветками соответствующих кадровых процессов, чтобы не дублировать один кадровый event как несколько искусственных процессов.
    Изменение должности может быть связано с кандидатом CAND-HR-MOVE-001; точная межпроцессная связь UNKNOWN.
