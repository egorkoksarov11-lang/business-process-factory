  - "По какому критерию подключается служба безопасности и что происходит с оставшейся частью запросов?"
  - "Кто согласует подготовленный бухгалтерский пакет и что означает состояние «ответ готов»?"
  - "Кто финально отправляет ответ контролирующему органу и через какой канал/систему?"
