metadata:
  created_at: "2026-08-22"
  updated_at: "2026-08-22"
  notes: |
    Detailed AS-IS intentionally keeps two source-authored tracks separate.
    CONFIRMED/PARTIAL CURRENT evidence from SRC-HR-DIR-001 is limited to the request originating from an immediate manager and being received by ROLE-HR-DIRECTOR-001 before recruitment work.
    SRC-HR-MODEL-002 steps, CEO approval, revision and rejection are preserved as REFERENCE_ONLY because model lifecycle/approval status is UNKNOWN.
    No TO-BE, BPMN, request-form design, HR-RECRUIT detailed logic or shared dictionary changes are introduced.
