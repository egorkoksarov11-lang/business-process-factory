    statement: "Шаг 1 'Сформировать и направить HR заявку на подбор' показан как свернутый подпроцесс до подбора кандидатов."
  - source_ref: SRC-HR-DIR-001
    evidence_class: EXPLICIT
    statement: "Директор по персоналу сообщает, что принимает заявки от непосредственных руководителей; интервью не раскрывает upstream-согласование заявки."
  - source_ref: "SRC-HR-MODEL-002 + SRC-HR-DIR-001"
    evidence_class: UNKNOWN
    statement: "Не установлено, является ли показанное в модели согласование Генеральным директором обязательным текущим AS-IS либо интервью просто опустило upstream-этап."

