metadata:
  created_at: "2026-08-21"
  updated_at: "2026-08-22"
  notes: |
    Agent 01 architecture boundary is preserved; detailed Agent 02 AS-IS artifacts are connected through canonical Schema v1.1 model_refs.
    Current interview-supported evidence confirms that an immediate manager's request for a vacant position is received by ROLE-HR-DIRECTOR-001 before recruitment work. It does not confirm CEO approval, revision, rejection, the upstream trigger, request contents or channel.
    SRC-HR-MODEL-002 is retained as REFERENCE_ONLY in detailed AS-IS because lifecycle_status and approval_status remain UNKNOWN.
    Status is CLARIFICATION_REQUIRED because trigger, approval applicability and exact positive boundary handoff materially affect the L1 model.
    No TO-BE, BPMN, request template, registry/dictionary change or HR-RECRUIT-001 detailed business-logic change is introduced.
