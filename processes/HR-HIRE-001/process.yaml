metadata:
  created_at: "2026-08-21"
  updated_at: "2026-08-21"
  notes: |
    Agent 01 synthesis only; detailed AS-IS intentionally not created.
    Boundary decision after SRC-HR-DIR-001:
    - получение сообщения от директора по персоналу больше не считается бизнес-триггером всей HR-цепочки; это handoff из подбора в кадровое оформление;
    - HR-HIRE-001 остается самостоятельным L1, потому что создает отдельный кадрово оформленный результат и имеет управляемую границу между подбором и адаптацией;
    - проверка документов, действия в 1С, ознакомление с ЛНА/подписание документов, отчетность в СФР и условный воинский учет остаются L2-блоками/операциями внутри HR-HIRE-001, а не отдельными L1;
    - связь с HR-ADAPT-001 является архитектурной последовательностью; фактическое временное пересечение в дату выхода требует проверки Agent 02.
