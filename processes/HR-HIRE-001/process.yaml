schema_version: "1.0"

process:
  process_id: "HR-HIRE-001"
  name: "Кадровое оформление приема сотрудника"
  domain: "HR"
  level: "L1"
  status: "ARCHITECTURE_READY"
  parent_process: null
  owner_role: UNKNOWN
  participants:
    - ROLE-HR-KDP-001
    - ROLE-HR-DIRECTOR-001
    - ROLE-EMPLOYEE-001
    - ROLE-FIN-CHIEF-ACCOUNTANT-001
    - ROLE-CEO-001
    - ROLE-MIL-RESP-001
  views:
    - VIEW-HR-KDP-ROLE-001
    - VIEW-HR-DIRECTOR-ROLE-001
    - VIEW-HR-HIRE-E2E-001
    - VIEW-HR-MODEL-ENTRY-E2E-001

boundaries:
  trigger: "Кандидат согласился на оффер и сведения о кандидате/условиях переданы в кадровое делопроизводство"
  input:
    - "Сведения о кандидате и условиях/дате выхода"
    - "Документы сотрудника; полный состав на Agent 01 не нормализуется"
  previous_processes:
    - HR-RECRUIT-001
  business_result: "Кадровое оформление приема завершено; применимые ветки воинского учета и отчетности в СФР обработаны в подтвержденной источниками границе"
  consumer: "Сотрудник, организация и HR-ADAPT-001"
  next_processes:
    - HR-ADAPT-001

sources:
  source_refs:
    - SRC-HR-KDP-001
    - SRC-HR-DIR-001
    - SRC-HR-MODEL-001
  evidence_refs:
    - "sources/evidence/SRC-HR-KDP-001_architecture.yaml"
    - "sources/evidence/SRC-HR-DIR-001_architecture.yaml"
    - "sources/evidence/SRC-HR-MODEL-001_architecture.yaml"

architecture_evidence:
  - source_ref: SRC-HR-KDP-001
    evidence_class: EXPLICIT
    statement: "Кадровик получает данные от директора по персоналу, проверяет документы, оформляет прием в 1С и кадровые документы, формирует сведения в СФР и выполняет применимую ветку воинского учета."
  - source_ref: SRC-HR-MODEL-001
    evidence_class: EXPLICIT
    statement: "После принятия оффера модель показывает collapsed subprocess оформления приема Кадровиком и параллельные ветки контроля выхода/начала адаптации, воинского учета и СФР."
  - source_ref: SRC-HR-DIR-001
    evidence_class: EXPLICIT
    statement: "Директор по персоналу контролирует кадровое делопроизводство по приемам и после выбора кандидата подтверждает его выход на согласованных условиях."
  - source_ref: "SRC-HR-KDP-001 vs SRC-HR-MODEL-001"
    evidence_class: CONFLICT
    statement: "SRC-HR-KDP-001 разделяет формирование СФР-сведений Кадровиком и отправку Главным бухгалтером; SRC-HR-MODEL-001 помещает подготовку и отправку в lane Главного бухгалтера."
  - source_ref: "SRC-HR-DIR-001 vs SRC-HR-MODEL-001"
    evidence_class: CONFLICT
    statement: "Модель помещает 'контроль выхода и начало адаптации' в lane Кадровика; интервью Директора по персоналу относит контроль адаптации к Директору. Элемент модели трактуется как boundary/handoff до уточнения."

architecture_subprocesses:
  - HR-HIRE-KDP-001
  - HR-HIRE-MIL-001
  - HR-HIRE-SFR-001

