metadata:
  created_at: "2026-08-21"
  updated_at: "2026-08-21"
  notes: |
    Agent 01 classification only; detailed AS-IS intentionally not created.
    Architectural decomposition for Agent 02:
    - получение сведений для приема: стартовый L2-блок/операция внутри L1, не отдельный L1;
    - проверка комплектности документов: контрольный L2-блок, не отдельный процесс;
    - ввод/оформление данных в 1С: операции внутри L2, 1С не определяет границу процесса;
    - ознакомление с ЛНА, оформление и подписание трудового договора и иных кадровых документов: L2-блок внутри приема;
    - отчетность о приеме в СФР: L2-блок внутри приема, не отдельный L1 только из-за смены системы/исполнителя;
    - воинский учет при приеме: условная L2-ветка для соответствующего сотрудника; отдельный L1 для самого факта приема не создавался.
    Source limitation: интервью одной роли не доказывает полноту процесса всей кадровой службы.
