metadata:
  created_at: "2026-08-21"
  updated_at: "2026-08-22"
  notes: |
    Agent 01 architecture boundary preserved.
    Agent 02 created unified v1.1 detailed AS-IS on parent HR-HIRE-001 and marked child steps with subprocess_id instead of duplicating L2 models.
