    - VIEW-HR-DIRECTOR-ROLE-001
    - VIEW-HR-HIRE-E2E-001

boundaries:
  trigger: "Поступление в кадровое делопроизводство сведений о выбранном кандидате для оформления приема перед выходом/началом работы"
  input:
    - "Сведения о выбранном кандидате и условиях/дате выхода, переданные из контура подбора; точный состав handoff остается UNKNOWN"
    - "Документы сотрудника; полный состав комплекта на архитектурной стадии не нормализуется"
  previous_processes:
    - HR-RECRUIT-001
  business_result: "Прием сотрудника кадрово оформлен; связанные с событием приема кадровые документы, отчетность и условная ветка воинского учета обработаны в пределах подтвержденной источниками границы"
  consumer: "Сотрудник, организация и следующий контур адаптации/испытательного срока"
  next_processes:
    - HR-ADAPT-001

sources:
  source_refs:
    - SRC-HR-KDP-001
    - SRC-HR-DIR-001
  evidence_refs:
    - "sources/evidence/SRC-HR-KDP-001_architecture.yaml"
    - "sources/evidence/SRC-HR-DIR-001_architecture.yaml"

architecture_evidence:
  - source_ref: SRC-HR-KDP-001
    evidence_class: EXPLICIT
    statement: "Работа кадрового специалиста по приему начинается после получения данных от директора по персоналу; далее описаны проверка документов, оформление в 1С, подписание кадровых документов, отчетность и условный воинский учет."
  - source_ref: SRC-HR-DIR-001
    evidence_class: EXPLICIT
    statement: "После выбора соискателя директор по персоналу готовит оффер; выбранные сотрудники выходят в назначенное время на определенных условиях. Директор также контролирует кадровое делопроизводство по приемам."
  - source_ref: "SRC-HR-KDP-001 + SRC-HR-DIR-001"
    evidence_class: INFERRED
    statement: "Сообщение директора по персоналу кадровому специалисту трактуется как внутренняя передача из HR-RECRUIT-001 в HR-HIRE-001, а не как самостоятельный бизнес-триггер всей цепочки найма."

