schema_version: "1.0"

process:
  process_id: "HR-HIRE-001"
  name: "Кадровое оформление приема сотрудника"
  domain: "HR"
  level: "L1"
  status: "ARCHITECTURE_READY"
  parent_process: null
  owner_role: UNKNOWN
  participants:
    - ROLE-HR-KDP-001
    - ROLE-HR-DIRECTOR-001
    - ROLE-EMPLOYEE-001
