  - "CONFLICT: фактическое распределение подготовки/отправки/подтверждения СФР."
  - "UNKNOWN: точная applicability HR-HIRE-MIL-001 и identity ROLE-MIL-RESP-001."
  - "UNKNOWN: должен ли HR-HIRE-MIL-001 завершиться до закрытия HR-HIRE-001."
  - "UNKNOWN: должен ли HR-HIRE-SFR-001 завершиться до закрытия HR-HIRE-001."
  - "UNKNOWN: timing полного закрытия HR-HIRE-001 относительно начала HR-ADAPT-001."
  - "CONFLICT: КДП vs Директор по персоналу на boundary начала адаптации."
  - "UNKNOWN: lifecycle/approval status SRC-HR-MODEL-001."
