metadata:
  created_at: "2026-08-21"
  updated_at: "2026-08-21"
  notes: |
    Agent 01 architecture only; detailed AS-IS intentionally not created.
    Адаптация выделена самостоятельным L1, потому что имеет собственный trigger (фактический выход сотрудника), отдельный управленческий результат (контроль периода и обратная связь) и отдельную временную границу относительно кадрового оформления приема.
    Получение обратной связи и устранение отдельных негативных моментов не разделяются на самостоятельные процессы.
