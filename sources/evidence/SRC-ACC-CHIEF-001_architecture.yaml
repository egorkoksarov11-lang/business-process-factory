classification_decisions:
  - object: "Перенос файлов между серверами"
    decision: CROSS_PROCESS_TECHNICAL_CONSTRAINT
    rationale: "Нет самостоятельного бизнес-результата и отдельного потребителя; операция повторяется внутри нескольких процессов."
  - object: "Удаление временных файлов на серверах"
    decision: TECHNICAL_OPERATION_RULE
    rationale: "Это правило эксплуатации ресурсов, а не L1/L2."
  - object: "Структура сетевых папок"
    decision: CROSS_PROCESS_PROBLEM
    rationale: "Проблема governance/records management; самостоятельная граница процесса не подтверждена."
  - object: "Прием входящих документов/ЭДО"
    decision: ARCHITECTURE_CANDIDATE
    rationale: "Триггер и маршрутизация есть, но поток смешивает разные бизнес-объекты и владелец функции прямо назван неясным."
  - object: "Электронный архив отчетности"
    decision: L2_WITHIN_ACC_REPORTING
    rationale: "Архив создается после подтверждения сдачи и завершает отчетный цикл."
  - object: "Электронный архив учредительных документов"
    decision: CROSS_DOMAIN_ARCHITECTURE_CANDIDATE
    rationale: "Есть потребность и проблема отсутствия сканов, но нет установленного владельца/lifecycle."

