schema_version: "1.0"
view:
  view_id: "VIEW-HR-MODEL-ENTRY-E2E-001"
  name: "Source E2E — существующая схема «Прием на работу»"
  view_type: "END_TO_END"
  subject_role: null
  subject_department: null
  purpose: "Сохранить архитектурное представление пользовательской схемы SRC-HR-MODEL-001 как отдельного E2E-маппинга без превращения всей схемы в один канонический L1."
  level: "L0"
  process_refs:
    - HR-STAFF-REQ-001
    - HR-RECRUIT-001
    - HR-HIRE-001
    - HR-ADAPT-001
  entry_point: "Возникла потребность в сотруднике"
  exit_point: "Кадровое оформление завершено; начало адаптации запущено согласно boundary-элементу модели"
  notes: |
    Source scope: SRC-HR-MODEL-001. Lifecycle/approval status модели UNKNOWN — view не объявляет ее AS-IS или TO-BE.
    HR-STAFF-REQ-001 включен потому, что MODEL-001#1 — свернутый подпроцесс заявки, детализированный SRC-HR-MODEL-002.
    HR-ADAPT-001 включен только как процесс, которого касается MODEL-001#7; существующая схема не описывает весь период адаптации до его бизнес-результата.
    Element-level transformation хранится в mappings/SRC-HR-MODEL-001.yaml.
    Схема показывает параллель после кадрового оформления: начало адаптации, воинский учет и СФР. Каноническая архитектура сохраняет эти элементы как handoff и L2 HR-HIRE-001, а не как отдельные L1.
