schema_version: "1.0"
view:
  view_id: "VIEW-HR-HIRE-E2E-001"
  name: "End-to-End — Оформление приема сотрудника"
  view_type: "END_TO_END"
  subject_role: null
  subject_department: null
  purpose: "Зафиксировать подтвержденную источником сквозную границу оформления приема через несколько ролей без детализации AS-IS и без искусственного выделения интерфейсных операций в отдельные процессы."
  level: "L1"
  process_refs:
    - HR-HIRE-001
  entry_point: "Получение ведущим специалистом по кадровому делопроизводству сведений для оформления приема от директора по персоналу"
  exit_point: "Кадровое оформление приема завершено в пределах подтвержденной границы; точная конечная точка относительно подтверждения сдачи отчетности в СФР остается UNKNOWN"
  notes: |
    Источник достаточен для выделения единого L1 HR-HIRE-001.
    Крупные внутренние блоки для последующего AS-IS: получение/проверка комплекта документов; регистрация кадровых данных и приема в 1С; ознакомление с ЛНА и подписание кадровых документов; подготовка отчетности о приеме; условная ветка воинского учета для соответствующего сотрудника.
    Эти блоки не получили отдельные L1 process_id на стадии Agent 01.
    Уведомление/подтверждение сдачи отчетности через главного бухгалтера не выделено в самостоятельный процесс только из-за смены исполнителя и внешнего адресата.
