schema_version: "1.0"
view:
  view_id: "VIEW-HR-HIRE-E2E-001"
  name: "HR End-to-End — от заявки на вакансию до завершения адаптации"
  view_type: "END_TO_END"
  subject_role: null
  subject_department: null
  purpose: "Показать реальную multi-process цепочку достижения результата по вводу нового сотрудника: подбор → кадровое оформление приема → адаптация/испытательный срок, сохраняя границы трех канонических L1."
  level: "L0"
  process_refs:
    - HR-RECRUIT-001
    - HR-HIRE-001
    - HR-ADAPT-001
  entry_point: "Поступление директору по персоналу заявки непосредственного руководителя на вакантную позицию"
  exit_point: "Период адаптации/испытательного срока проконтролирован и получена обратная связь; формальное решение по итогам периода остается UNKNOWN"
  notes: |
    Это multi-process END_TO_END, а не детальная BPMN-схема.
    SRC-HR-DIR-001: раскрывает заявку → профиль → поиск → интервью → выбор → оффер → выход сотрудника → контроль адаптации/испытательного срока.
    SRC-HR-KDP-001: раскрывает внутренний handoff от директора по персоналу к кадровому специалисту и кадровое оформление приема после получения сведений.
    Cross-source synthesis: сообщение директора по персоналу в SRC-HR-KDP-001 является handoff HR-RECRUIT-001 → HR-HIRE-001; точный момент handoff относительно принятия оффера и даты выхода UNKNOWN.
    Связь HR-HIRE-001 → HR-ADAPT-001 архитектурно подтверждается выходом сотрудника и последующим контролем адаптации. Фактическое временное пересечение приема/отчетности с началом адаптации возможно и должно проверяться Agent 02, а не выдумываться на Agent 01.
    Старый VIEW-HR-TERM-E2E-001 удаляется: один HR-TERM-001 сам по себе не является multi-process E2E view.
