schema_version: "1.0"
view:
  view_id: "VIEW-HR-DIRECTOR-ROLE-001"
  name: "Landscape роли — Директор по персоналу"
  view_type: "ROLE_LANDSCAPE"
  subject_role: "ROLE-HR-DIRECTOR-001"
  subject_department: null
  purpose: "Показать канонические процессы, в которых участие директора по персоналу подтверждено текущими HR-источниками, и отделить их от перечисленных обязанностей, которые пока не имеют подтвержденной канонической границы."
  level: "L0"
  process_refs:
    - HR-RECRUIT-001
    - HR-HIRE-001
    - HR-ADAPT-001
    - HR-TERM-001
  entry_point: null
  exit_point: null
  notes: |
    Официальное подразделение директора по персоналу в SRC-HR-DIR-001 указано как UNKNOWN, поэтому DEPARTMENT_LANDSCAPE и вымышленное название HR-подразделения не создавались.
    SRC-HR-DIR-001 прямо раскрывает HR-RECRUIT-001 и HR-ADAPT-001, а также контроль приемов/увольнений; SRC-HR-KDP-001 подтверждает передачу директором данных в кадровое оформление приема.
    В интервью директора также названы график отпусков, локальные нормативные акты, конфликты/судебная поддержка, документы для проверок, ФОТ, корпоративные мероприятия и изменение штатной численности. Они не потеряны: зафиксированы в process_registry как architecture candidates, но не включены в process_refs до отдельного boundary-review.
    Контроль кадрового делопроизводства как таковой классифицирован как cross-process governance responsibility, а не отдельный L1: он охватывает приемы, увольнения, переводы, личные дела, приказы, табелирование, отпуска и больничные.
