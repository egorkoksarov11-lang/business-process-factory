  notes: |
    Официальное подразделение Директора по персоналу остается UNKNOWN; DEPARTMENT_LANDSCAPE не создается.
    HR-STAFF-REQ-001 — upstream process, где SRC-HR-MODEL-002 показывает Руководителя подразделения и Генерального директора; Директор по персоналу является downstream consumer, поэтому process_ref не добавлен как участие.
