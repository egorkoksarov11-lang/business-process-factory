    Конфликт по адаптации сохранен: SRC-HR-DIR-001 подтверждает полноценный контроль адаптации Директором, MODEL-001#7 расположен у Кадровика.
    Остальные обязанности интервью остаются architecture candidates/cross-process responsibilities, пока их границы не подтверждены.
