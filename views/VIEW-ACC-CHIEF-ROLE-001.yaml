  notes: |
    Это ROLE_LANDSCAPE, а не end-to-end поток: перечисленные L1 имеют независимые событийные/календарные triggers.
    CAND-ACC-INBOX-001 (прием и маршрутизация входящих документов/запросов) не включен в process_refs: деятельность подтверждена, но доменная граница и владелец функции остаются UNKNOWN.
    Перенос файлов между тремя серверами, удаление временных файлов и работа со структурой сетевых папок не являются process_refs: они сохранены как cross-process technical constraints/problems.
    Отсутствие части электронного архива учредительных документов также не канонизировано как ACC process.
