schema_version: "1.0"
view:
  view_id: "VIEW-HR-TERM-E2E-001"
  name: "End-to-End — Оформление увольнения сотрудника"
  view_type: "END_TO_END"
  subject_role: null
  subject_department: null
  purpose: "Зафиксировать подтвержденный источником сквозной фрагмент увольнения через несколько ролей, не подменяя им все возможные основания прекращения трудовых отношений."
  level: "L1"
  process_refs:
    - HR-TERM-001
  entry_point: "Получение заявления сотрудника об увольнении — раскрытый источником сценарий"
  exit_point: "Кадровое увольнение оформлено, документы выданы сотруднику и связанная отчетность передана на отправку; граница относительно полного расчета и подтверждения сдачи отчетности требует уточнения"
  notes: |
    Источник позволяет выделить HR-TERM-001 как самостоятельный L1 для раскрытого сценария увольнения по заявлению сотрудника.
    Отчетность об увольнении не выделена в отдельный L1.
    Действия по воинскому учету при увольнении рассматриваются как условная ветка до получения данных, подтверждающих самостоятельную управленческую границу.
    Передача дел замещающему сотруднику упомянута условно; принадлежность этого блока HR-TERM-001 или соседнему процессу подразделения сотрудника остается UNKNOWN.
