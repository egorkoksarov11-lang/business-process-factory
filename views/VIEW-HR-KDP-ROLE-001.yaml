schema_version: "1.0"
view:
  view_id: "VIEW-HR-KDP-ROLE-001"
  name: "Landscape роли — Ведущий специалист по кадровому делопроизводству"
  view_type: "ROLE_LANDSCAPE"
  subject_role: "ROLE-HR-KDP-001"
  subject_department: "Администрация"
  purpose: "Показать канонические L1-процессы роли КДП и отдельно отметить source-specific boundary участие в начале адаптации."
  level: "L0"
  process_refs:
    - HR-HIRE-001
    - HR-TERM-001
    - HR-MIL-ORG-001
    - HR-MIL-CHANGE-001
    - HR-MIL-RECON-001
    - HR-REPORT-REQ-001
  entry_point: null
  exit_point: null
  notes: |
    Это landscape, не последовательный E2E.
    SRC-HR-KDP-001 подробно подтверждает участие роли в приеме, прекращении отношений, воинском учете и отчетах; SRC-HR-DIR-001 подтверждает контроль этих кадровых направлений Директором по персоналу.
    SRC-HR-MODEL-001 добавляет lane Кадровика для core приема, воинской ветки и MODEL-001#7 'Контроль выхода сотрудника и начало адаптации'. HR-ADAPT-001 не добавлен в process_refs как полноценное участие роли: MODEL-001#7 трактуется как boundary/handoff до разрешения конфликта с SRC-HR-DIR-001.
    Отчетность СФР формализована как L2 HR-HIRE-SFR-001 с owner UNKNOWN из-за source conflict.
    CAND-HR-MOVE-001 остается кандидатом; операции личных дел/приказов/табелирования не превращены в отдельные L1.
