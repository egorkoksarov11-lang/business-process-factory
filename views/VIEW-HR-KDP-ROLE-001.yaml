schema_version: "1.0"
view:
  view_id: "VIEW-HR-KDP-ROLE-001"
  name: "Landscape роли — Ведущий специалист по кадровому делопроизводству"
  view_type: "ROLE_LANDSCAPE"
  subject_role: "ROLE-HR-KDP-001"
  subject_department: "Администрация"
  purpose: "Показать канонические бизнес-процессы, в которых участвует ведущий специалист по кадровому делопроизводству по совместному synthesis SRC-HR-KDP-001 и SRC-HR-DIR-001, без превращения операций и независимых периодических процессов в одну последовательность."
  level: "L0"
  process_refs:
    - HR-HIRE-001
    - HR-TERM-001
    - HR-MIL-ORG-001
    - HR-MIL-CHANGE-001
    - HR-MIL-RECON-001
    - HR-REPORT-REQ-001
  entry_point: null
  exit_point: null
  notes: |
    Это landscape, а не последовательный E2E-flow.
    SRC-HR-KDP-001 подробно подтверждает участие роли в HR-HIRE-001, HR-TERM-001, воинском учете и кадровых отчетах.
    SRC-HR-DIR-001 подтверждает, что ведущий специалист находится в подчинении директора по персоналу и что директор контролирует кадровое делопроизводство по приемам, увольнениям, переводам и иным движениям.
    HR-RECRUIT-001 и HR-ADAPT-001 в process_refs не включены: текущие источники подтверждают их как процессы директора по персоналу, но не подтверждают самостоятельное участие ROLE-HR-KDP-001.
    CAND-HR-MOVE-001 подтвержден обоими источниками как область работы, но не канонизирован из-за недостаточной границы.
    Персональные дела, приказы, табелирование, учет отпусков и больничных, перечисленные SRC-HR-DIR-001 внутри контроля КДП, не превращены автоматически в отдельные L1.
    AMBIGUITY по ROLE-MIL-RESP-001 сохраняется: это может быть отдельная роль или функция ROLE-HR-KDP-001.
