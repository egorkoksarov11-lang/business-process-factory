schema_version: "1.0"
view:
  view_id: "VIEW-HR-KDP-ROLE-001"
  name: "Landscape роли — Ведущий специалист по кадровому делопроизводству"
  view_type: "ROLE_LANDSCAPE"
  subject_role: "ROLE-HR-KDP-001"
  subject_department: "Администрация"
  purpose: "Показать канонические бизнес-процессы, в которых участвует ведущий специалист по кадровому делопроизводству согласно SRC-HR-KDP-001, без превращения независимых и периодических процессов в одну искусственную последовательность."
  level: "L0"
  process_refs:
    - HR-HIRE-001
    - HR-TERM-001
    - HR-MIL-ORG-001
    - HR-MIL-CHANGE-001
    - HR-MIL-RECON-001
    - HR-REPORT-REQ-001
  entry_point: null
  exit_point: null
  notes: |
    Это landscape, а не последовательный E2E-flow.
    HR-HIRE-001 и HR-TERM-001 — независимые кадровые события.
    HR-MIL-ORG-001 — первоначальный самостоятельный процесс постановки организации на воинский учет.
    HR-MIL-RECON-001 — независимый ежегодный периодический процесс.
    HR-MIL-CHANGE-001 — событийная актуализация сведений при изменениях данных сотрудника.
    HR-REPORT-REQ-001 — процесс по внешнему/внутреннему запросу; инициатор запроса пока UNKNOWN.
    CAND-HR-MOVE-001 "Оформление перевода / кадрового перемещения" названо основным направлением работы, но не включено в process_refs, так как граница и business result недостаточно раскрыты для канонического process_id.
    Во всех воинских процессах участие текущей роли подтверждается общим заявлением о ведении воинского учета, но остается ambiguity: ROLE-MIL-RESP-001 может быть отдельной ролью либо функцией ROLE-HR-KDP-001.
